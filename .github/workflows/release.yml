name: Release Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(awk -F ' = ' '/^version = / {gsub(/"/, "", $2); print $2; exit}' src-tauri/Cargo.toml)"

          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version mismatch: tag is $TAG_VERSION, package.json is $PACKAGE_VERSION"
            exit 1
          fi

          if [[ "$TAURI_VERSION" != "$TAG_VERSION" ]]; then
            echo "tauri.conf.json version mismatch: tag is $TAG_VERSION, tauri.conf.json is $TAURI_VERSION"
            exit 1
          fi

          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "Cargo.toml version mismatch: tag is $TAG_VERSION, Cargo.toml is $CARGO_VERSION"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Run source tests
        shell: bash
        run: |
          for test_file in test/*.test.mjs; do
            node "$test_file"
          done

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  prepare-release:
    name: Prepare release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or reuse draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG already exists."
            exit 0
          fi

          # Pull the section for this version out of CHANGELOG.md and prepend
          # the runtime notice that the desktop builds never ship frpc
          # themselves.
          SECTION="$(awk '/^## '"${RELEASE_TAG#v}"'/ {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md)"
          if [[ -z "$SECTION" ]]; then
            echo "::error::no ${RELEASE_TAG#v} section in CHANGELOG.md"
            exit 1
          fi

          {
            echo "$SECTION"
            echo
            echo "---"
            echo
            echo "Packages are built for macOS, Windows, and Linux. The frpc runtime is not bundled; install or update it from Runtime Settings inside the app."
          } > release-notes.md

          gh release create "$RELEASE_TAG" \
            --draft \
            --title "FRP Manager $RELEASE_TAG" \
            --notes-file release-notes.md

  release:
    name: Build ${{ matrix.label }}
    needs:
      - test
      - prepare-release
    if: always() && needs.test.result == 'success' && (!startsWith(github.ref, 'refs/tags/') || needs.prepare-release.result == 'success')
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - label: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - label: windows-x64
            platform: windows-latest
            args: ""
            rust_target: ""
          - label: linux-x64
            platform: ubuntu-22.04
            args: ""
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.label }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" == "v__VERSION__" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          {
            awk '/^## '"$VERSION"'/ {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md
            echo
            echo "---"
            echo
            echo "Packages are built for macOS, Windows, and Linux. The frpc runtime is not bundled; install or update it from Runtime Settings inside the app."
          } > release-notes.md

          {
            echo "RELEASE_BODY<<NOTES_EOF"
            cat release-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Build and upload release bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.label, 'macos-') && '-' || '' }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: FRP Manager ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          includeDebug: false
          releaseAssetNamePattern: "FRP-Manager_[version]_[platform]_[arch][setup][ext]"
